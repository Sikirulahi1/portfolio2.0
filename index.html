<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Name — AI Engineer · Backend Developer · AI Researcher</title>
<meta name="description" content="Portfolio of Your Name — AI engineer, backend developer and AI researcher. RAG systems, ML infrastructure, production backends and published research. Open to opportunities.">
<meta name="theme-color" content="#070B09">
<meta property="og:title" content="Your Name — AI Engineer · Backend Developer · AI Researcher">
<meta property="og:description" content="I build and research AI systems end-to-end — from backend infrastructure to models to published work.">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<a class="skip-link" href="#about">Skip to content</a>
<canvas id="space" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="glow" aria-hidden="true"></div>
<div id="progress" aria-hidden="true"></div>

<!-- intro: emerald line draws, curtain splits -->
<div id="intro" aria-hidden="true">
  <div class="p t"></div>
  <div class="p b"></div>
  <div class="line"></div>
  <div class="tag" id="introTag">YOUR.NAME</div>
</div>

<!-- ================= NAV ================= -->
<header class="nav">
  <div class="nav-in">
    <a class="brand" href="#top" id="navBrand">Your Name<span class="dot">.</span></a>
    <nav class="nav-links" id="navLinks" aria-label="Sections"></nav>
    <span class="status"><i></i>OPEN TO WORK</span>
  </div>
</header>

<!-- ================= HERO ================= -->
<main id="top">
<section class="hero">
  <div class="wrap">
    <div class="hero-eyebrow">Hi, I'm</div>
    <h1 class="name pre" id="heroName" aria-label="Your Name"></h1>
    <div class="role-row" aria-label="AI Engineer, Backend Developer, AI Researcher"><span id="typed"></span><span class="tc" aria-hidden="true"></span></div>
    <p class="hero-sub" id="heroSub"></p>
    <div class="btn-row" id="heroBtns"></div>
    <div class="hero-meta" id="heroMeta"></div>
  </div>
</section>

<!-- ================= ABOUT ================= -->
<section class="sec" id="about">
  <div class="wrap">
    <div class="eyebrow rv">About</div>
    <h2 class="sec-title rv" data-scramble id="aboutTitle"></h2>
    <p class="sec-sub rv d1" id="aboutSub"></p>
    <div class="about-grid">
      <div class="bio rv" id="aboutBio"></div>
      <div>
        <div class="card side-card rv d1" data-glow>
          <h3>Right now</h3>
          <div id="aboutNow"></div>
        </div>
        <div class="card side-card rv d2" data-glow>
          <h3>Off the clock</h3>
          <div class="int-tags" id="aboutOffClock"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ================= WHAT I DO ================= -->
<section class="sec" id="whatido">
  <div class="wrap">
    <div class="eyebrow rv">What I do</div>
    <h2 class="sec-title rv" data-scramble id="whatidoTitle"></h2>
    <p class="sec-sub rv d1" id="whatidoSub"></p>
    <div class="do-grid" id="whatidoGrid"></div>
  </div>
</section>

<!-- ================= WORK EXPERIENCE ================= -->
<section class="sec" id="work">
  <div class="wrap">
    <div class="eyebrow rv">Work experience</div>
    <h2 class="sec-title rv" data-scramble id="workTitle"></h2>
    <p class="sec-sub rv d1" id="workSub"></p>
    <div class="timeline rv" id="workTimeline" aria-label="Work experience"></div>
  </div>
</section>

<!-- ================= PROJECTS ================= -->
<section class="sec" id="projects">
  <div class="wrap">
    <div class="eyebrow rv">Projects</div>
    <h2 class="sec-title rv" data-scramble id="projectsTitle"></h2>
    <p class="sec-sub rv d1" id="projectsSub"></p>
    <div class="proj-grid" id="projectsGrid"></div>
  </div>
</section>

<!-- ================= PUBLICATIONS ================= -->
<section class="sec" id="publications">
  <div class="wrap">
    <div class="eyebrow rv">Publications</div>
    <h2 class="sec-title rv" data-scramble id="pubsTitle"></h2>
    <p class="sec-sub rv d1" id="pubsSub"></p>
    <div class="pub-list" id="pubsList"></div>
  </div>
</section>

<!-- ================= BLOGS ================= -->
<section class="sec" id="blogs">
  <div class="wrap">
    <div class="eyebrow rv">Blogs</div>
    <h2 class="sec-title rv" data-scramble id="blogsTitle"></h2>
    <p class="sec-sub rv d1" id="blogsSub"></p>
    <div class="blog-grid" id="blogsGrid"></div>
  </div>
</section>

<!-- ================= SKILLS ================= -->
<section class="sec" id="skills">
  <div class="wrap">
    <div class="eyebrow rv">Skills</div>
    <h2 class="sec-title rv" data-scramble id="skillsTitle"></h2>
    <p class="sec-sub rv d1" id="skillsSub"></p>
    <div class="skill-grid" id="skillsGrid"></div>
  </div>
</section>

<!-- ================= GITHUB LIVE ================= -->
<section class="sec" id="github">
  <div class="wrap">
    <div class="eyebrow rv">GitHub — live</div>
    <h2 class="sec-title rv" data-scramble id="githubTitle"></h2>
    <p class="sec-sub rv d1" id="githubSub"></p>
    <div class="gh-stats rv">
      <div class="card stat"><div class="v" id="statRepos">—</div><div class="k">Public repos</div></div>
      <div class="card stat"><div class="v" id="statContrib">—</div><div class="k">Contributions / yr</div></div>
      <div class="card stat"><div class="v" id="statStars">—</div><div class="k">Stars earned</div></div>
      <div class="card stat"><div class="v" id="statFollowers">—</div><div class="k">Followers</div></div>
    </div>
    <div class="cal-card rv">
      <div class="cal-head">
        <span class="t">Contribution graph</span>
        <span class="sub" id="calTotal">last 12 months</span>
        <span class="chip" id="ghStatus"><i></i>CONNECTING…</span>
      </div>
      <div class="cal-scroll">
        <div class="cal-months" id="calMonths" aria-hidden="true"></div>
        <div class="cal-grid" id="calGrid" role="img" aria-label="GitHub contribution calendar for the last year"></div>
      </div>
      <div class="cal-foot" id="calFoot"></div>
    </div>
    <div class="repo-grid" id="repoFeed"></div>
    <div class="gh-foot" id="ghFoot"></div>
  </div>
</section>

<!-- ================= CONTACT ================= -->
<section class="sec" id="contact">
  <div class="wrap">
    <div class="eyebrow rv">Contact</div>
    <h2 class="contact-big rv" data-scramble id="contactTitle"></h2>
    <p class="contact-note rv d1" id="contactNote"></p>
    <div class="btn-row rv d2" id="contactBtns"></div>
    <div class="contact-meta rv d3" id="contactMeta"></div>
  </div>
</section>
</main>

<footer>
  <div class="wrap foot-in" id="footer"></div>
</footer>

<div id="toast" role="status"></div>
<div id="cur" aria-hidden="true"></div>
<div id="curDot" aria-hidden="true"></div>
<script type="module" src="/src/scripts/main.js"></script>
</body>
</html>
